[package]
name = "isaac-trainer"
version = "0.1.0"
description = "The Binding of Isaac: Repentance+ trainer UI"
authors = ["local"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "isaac_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
